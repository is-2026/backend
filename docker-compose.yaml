name: futbot

services:
  backend:
    image: futbot-backend:latest
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

  db:
    image: mysql:9
    env_file: .env
    ports:
      # Puerto del host : puerto del contenedor
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data: